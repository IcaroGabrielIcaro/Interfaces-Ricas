<div class="relative w-full h-[60vh] bg-slate-900 rounded-2xl overflow-hidden">
  <div class="absolute inset-0 bg-cover bg-center transition-all duration-700 ease-in-out" [style.background-image]="'url(' + mainBannerUrl + ')'"></div>

  <div class="absolute inset-0 bg-gradient-to-r from-transparent via-slate-800/70 to-slate-800"></div>

  <div class="relative z-10 flex items-center h-full px-16">
    <div>
      <h1 class="text-white text-5xl font-bold tracking-wide mb-4 drop-shadow-lg">
        Suspiria
      </h1>
      <p class="text-gray-300 text-lg">Terror, Drama, Bruxaria</p>
    </div>
  </div>

  <div class="absolute top-1/2 right-8 -translate-y-1/2 z-20 grid grid-cols-3 grid-rows-3 gap-2">
    @for (movie of movies; track $index) {
      <div class="relative w-64 h-40 rounded-xl overflow-hidden cursor-pointer transition-transform hover:scale-105 shadow-lg" (click)="trocarBanner(movie.foto)">
        <img [src]="movie.foto" [alt]="movie.nome" class="w-full h-full object-cover"/>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/70 to-transparent opacity-0 hover:opacity-100 transition-opacity"></div>
      </div>
    }
  </div>
</div>
