<form #movieForm="ngForm" (ngSubmit)="onSubmit()" class="max-w-2xl mx-auto bg-slate-800 text-white p-6 rounded-2xl shadow-lg border border-gray-700 mt-10 space-y-4">
  <h2 class="text-2xl font-bold font-mono mb-2 text-center">Adicionar Filme</h2>

  <!-- Nome -->
  <div>
    <label for="nome" class="block text-sm text-gray-300 font-mono mb-1">Nome do filme</label>
    <input
      id="nome"
      name="nome"
      type="text"
      [(ngModel)]="novoFilme.nome"
      required
      class="w-full p-2 rounded-md bg-slate-700 border border-slate-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-400 font-mono"
      placeholder="Ex: Interstellar">
  </div>

  <!-- Review -->
  <div>
    <label for="review" class="block text-sm text-gray-300 font-mono mb-1">Review</label>
    <textarea
      id="review"
      name="review"
      [(ngModel)]="novoFilme.review"
      rows="3"
      required
      class="w-full p-2 rounded-md bg-slate-700 border border-slate-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-yellow-400 font-mono"
      placeholder="Escreva uma breve opinião sobre o filme..."></textarea>
  </div>

  <!-- Nota -->
  <div>
    <label for="nota" class="block text-sm text-gray-300 font-mono mb-1">Nota (0 a 10)</label>
    <input
      id="nota"
      name="nota"
      type="number"
      [(ngModel)]="novoFilme.nota"
      min="0"
      max="10"
      step="0.1"
      required
      class="w-full p-2 rounded-md bg-slate-700 border border-slate-600 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400 font-mono">
  </div>

  <!-- Favorito -->
  <div class="flex items-center space-x-2">
    <input
      id="favorito"
      name="favorito"
      type="checkbox"
      [(ngModel)]="novoFilme.favorito"
      class="w-4 h-4 accent-yellow-400">
    <label for="favorito" class="text-sm text-gray-300 font-mono">Marcar como favorito</label>
  </div>

  <!-- Botão -->
  <div class="text-center pt-2">
    <button
      type="submit"
      [disabled]="!movieForm.form.valid"
      class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold px-6 py-2 rounded-lg transition-all disabled:opacity-40 disabled:cursor-not-allowed font-mono">
      Enviar
    </button>
  </div>
</form>
